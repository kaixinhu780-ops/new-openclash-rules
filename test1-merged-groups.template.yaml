# 公开完整配置模板，不含节点订阅。请先在本地填写proxy-providers的url。
# 不能当作rule-providers规则片段使用；Muse规则片段地址为rules/MuseMeta.yaml。
# Muse固定出口默认REJECT，填入节点后仍需手动选择美国节点。
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxy-providers:
  Provider_1F9158:
    type: http
    url: ''
    path: ./proxy_provider/provider-1.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  Provider_D19E8E:
    type: http
    url: ''
    path: ./proxy_provider/provider-2.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
- name: 🚀 手动选择
  type: select
  use:
  - Provider_1F9158
  - Provider_D19E8E
  filter: .*
  proxies:
  - ♻️ 自动选择
  - 🇭🇰 香港节点
  - 🇺🇸 美国节点
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🇼🇸 台湾节点
  - 🇰🇷 韩国节点
  - 🇨🇦 加拿大节点
  - 🇬🇧 英国节点
  - 🇫🇷 法国节点
  - 🇩🇪 德国节点
  - 🇳🇱 荷兰节点
  - 🇹🇷 土耳其节点
  - 🇷🇺 俄罗斯节点
  - 🌐 其他地区
  - 🏠 家宽节点
  - 🐢 低倍率节点
