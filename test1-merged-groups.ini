; Test1 standalone group merge | 2026-10-25
; Supply your own private subscription to the converter. No subscription is embedded.
; Muse starts at REJECT. Select a concrete US node after import.
; Broad Meta/Muse rules also cover some shared Facebook/Instagram/WhatsApp traffic.
; No DNS/sniffer/base payload is supplied; preserve/configure them in OpenClash.
